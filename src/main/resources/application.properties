spring.datasource.url=jdbc:postgresql://localhost:5432/medapi
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=none
spring.datasource.driver-class-name=org.postgresql.Driver


logs sql queries
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring.data.redis.host=redis-server
#spring.data.redis.port=6379

spring.flyway.url=jdbc:postgresql://localhost:5432/medapi
spring.flyway.user=postgres
spring.flyway.password=root
spring.flyway.schemas=public
spring.flyway.locations=filesystem:src/main/resources/db/migration
spring.flyway.baseline-on-migrate=true

api.security.token.secret=api_springboot_med

opencage.api.key=apiKeyOpenCage